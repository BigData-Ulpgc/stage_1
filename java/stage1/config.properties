# Configuración de la implementación Java (la lee AppConfig).
# Cualquier clave se puede cambiar al ejecutar con -Dclave=valor.
# Rutas relativas a la carpeta desde la que se ejecuta (java/stage1).

data.dir = data
shared.dir = ../../shared
benchmarks.dir = benchmarks

# Estructura activa del datalake: book | range | time
datalake.structure = time
# Índice invertido activo: monolithic | hierarchical | mongo | memory
index.structure = monolithic

# Sólo si index.structure = mongo (la variable de entorno MONGO_URI tiene prioridad)
mongo.uri = mongodb://localhost:27017
mongo.database = search_engine
mongo.collection = inverted_index

# Timeouts de la descarga de Gutenberg, en segundos
http.connect.timeout.seconds = 10
http.request.timeout.seconds = 15

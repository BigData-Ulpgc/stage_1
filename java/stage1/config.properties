# Configuración de la implementación Java (la lee AppConfig).
# Cualquier clave se puede cambiar al ejecutar con -Dclave=valor.
# Rutas relativas a la carpeta desde la que se ejecuta (java/stage1).

data.dir = data
shared.dir = ../../shared
# Muestra de 15 libros sin red (pipeline --offline)
sample.dir = ../../sample_dataset
benchmarks.dir = benchmarks

# Estructuras elegidas por los benchmarks (200 libros reales, ver docs/Stage1_Java_Report.pdf):
#  - book: la escritura más rápida (1.031 libros/s), el lookup más rápido (3,3 µs frente a 94,5 µs
#    de time) y la detección de libros nuevos más rápida; además es el datalake que leen los benchmarks.
#  - monolithic: el más rápido construyendo (1,7 s frente a 11-14 s), consultando (4,5 µs frente a
#    48-345 µs) y añadiendo libros (85 ms frente a ~1 s), y el que menos disco ocupa. Pasar a mongo
#    a partir de unos 2.000 libros, cuando reescribir el JSON entero y tenerlo en memoria deja de compensar.

# Estructura activa del datalake: book | range | time
datalake.structure = book
# Índice invertido activo: monolithic | hierarchical | mongo | memory
index.structure = monolithic

# Sólo si index.structure = mongo (la variable de entorno MONGO_URI tiene prioridad)
mongo.uri = mongodb://localhost:27017
mongo.database = search_engine
mongo.collection = inverted_index

# Timeouts de la descarga de Gutenberg, en segundos
http.connect.timeout.seconds = 10
http.request.timeout.seconds = 15

# Configuration of the C++ module, read by the CLI (see cpp/docs/USER_GUIDE.md, section 3).
# Same keys as java/stage1/config.properties. Without this file, the defaults are Java's: time, monolithic.
# Any key can be changed for one run with -Dkey=value, before the command:
#   ./build/release/search_engine_stage1 -Dindex.structure=hierarchical pipeline 400

# Structures selected from this module's benchmarks on the 200 real books, the same choice as the
# Java module (see cpp/docs/MODULE_REPORT.md, "Chosen structures"):
#  - book: the fastest lookup that survives a restart (2.5 us per book, 2.9 for range; time cannot
#    compute a book's folder from its id), the fastest detection of new books (0.98 ms) and the
#    fastest recovery (19.1 ms).
#  - monolithic: the fastest queries (1.4 us, against 22 for hierarchical and 315 for mongo), the
#    fastest build and the cheapest update at this size (300 ms per book). Its update cost and its
#    memory grow with the index; on the measured trend, hierarchical becomes the cheaper one to
#    update at roughly 700 books.

# Datalake structure the pipeline writes to: book | range | time
datalake.structure = book

# Inverted index the pipeline writes and search reads: monolithic | hierarchical | mongo
index.structure = monolithic
